[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reqrec"
version = "0.1.0"
description = "Record a website's HTTP traffic (proxy or HAR) and generate a standalone Python scraping script from it, like a macro recorder for HTTP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "reqrec contributors" }]
keywords = ["scraping", "har", "mitmproxy", "code-generator", "requests"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "requests>=2.28",
  "beautifulsoup4>=4.11",
  "flask>=3.0",
]

[project.optional-dependencies]
record = ["mitmproxy>=10"]
lxml = ["lxml>=4.9"]
# 統合 Windows 認証 (NTLM / Negotiate) を使うサイト向け。生成コードが利用します。
ntlm = ["requests_ntlm>=1.2"]
sspi = ["requests-negotiate-sspi>=0.5; sys_platform == 'win32'"]
dev = ["pytest>=7", "mitmproxy>=10", "lxml>=4.9", "playwright>=1.40", "requests_ntlm>=1.2"]

[project.scripts]
reqrec = "reqrec.cli:main"

[tool.setuptools.packages.find]
include = ["reqrec*"]

[tool.setuptools.package-data]
"reqrec.webapp" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
